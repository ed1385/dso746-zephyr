# ---- kernel -----------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# ---- cache: the ADC ring must not be cached, DMA does not see D-cache --
CONFIG_DCACHE=y
CONFIG_ICACHE=y
CONFIG_NOCACHE_MEMORY=y

# ---- display ----------------------------------------------------------
CONFIG_DISPLAY=y
CONFIG_STM32_LTDC=y
CONFIG_STM32_LTDC_RGB565=y
CONFIG_STM32_LTDC_FB_NUM=2

# ---- touch ------------------------------------------------------------
CONFIG_INPUT=y
CONFIG_I2C=y
CONFIG_INPUT_FT5336=y
CONFIG_INPUT_FT5336_INTERRUPT=y
# B1 USER key: demo <-> live
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_GPIO=y

# ---- LVGL -------------------------------------------------------------
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_16=y
CONFIG_LV_Z_MEM_POOL_SIZE=131072
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_Z_DOUBLE_VDB=y
# 256 KB of internal SRAM cannot hold the LVGL heap and two render buffers as
# well as the ADC ring; both go to SDRAM, the ring stays in SRAM on purpose
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION=y
CONFIG_LV_Z_MEMORY_POOL_ZEPHYR_REGION_NAME="SDRAM1"
CONFIG_LV_Z_VDB_ZEPHYR_REGION=y
CONFIG_LV_Z_VDB_ZEPHYR_REGION_NAME="SDRAM1"
CONFIG_LV_Z_FLUSH_THREAD=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
# the phosphor halo is a shadow; caching the blur costs 16*16 = 256 bytes
# and removes the per-redraw recomputation
CONFIG_LV_DRAW_SW_COMPLEX=y
# ChromART (DMA2D) draw unit: fills, blends and blits are done by the
# accelerator, and the transfer-complete interrupt frees the CPU while it runs
CONFIG_LV_USE_DRAW_DMA2D=y
CONFIG_LV_DRAW_DMA2D_HAL_INCLUDE="stm32f7xx_hal.h"
CONFIG_LV_USE_DRAW_DMA2D_INTERRUPT=y
CONFIG_LV_DRAW_SW_SHADOW_CACHE_SIZE=16

# ---- DSP --------------------------------------------------------------
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_CMSIS_DSP_SUPPORT=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_CMSIS_DSP_STATISTICS=y

# ---- console ----------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
